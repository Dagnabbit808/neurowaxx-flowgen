<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Phrase Generator · Neurowaxx</title>
<style>
:root{--bg:#0e0e10;--panel:#17171b;--line:#2a2a31;--text:#ececf1;--dim:#9a9aa6;--acc:#e0303a;--ok:#3fb67a;--warn:#e0a030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px}@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
button{background:#25252c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--dim)}button.pri{background:var(--acc);border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:#0b0b0d;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ln{display:flex;gap:6px;align-items:center;margin:4px 0}.ln input[type=text]{flex:1;min-width:0}.num{width:48px;color:var(--dim);font-size:12px}
.dim{color:var(--dim);font-size:12px}.cand{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.cand.fail{opacity:.6}
.chip{display:inline-flex;gap:4px;align-items:center;background:#25252c;border-radius:999px;padding:2px 8px;font-size:12px;margin:2px}
.chip b{cursor:pointer}.bad{color:var(--acc)}.good{color:var(--ok)}pre{white-space:pre-wrap}
</style><style>.cmain{grid-template-columns:minmax(0,1fr) 320px}@media(max-width:800px){main,.cmain{display:block;grid-template-columns:1fr!important;padding:10px}main>*{position:static!important;width:auto!important;max-width:100%;margin-bottom:14px}}html,body{max-width:100%;overflow-x:hidden}*{box-sizing:border-box}select,input,button,textarea{max-width:100%}</style></head><body>
<header><h1>Neurowaxx Flowgen · Classic Phrase Generator</h1><a href="index.html" style="color:var(--dim)">← Song Workspace</a></header>
<main class="cmain">
<div><div class="panel"><h2>Lyric lead</h2>
<div class="row"><select id="topic"></select><label class="dim"><input type="checkbox" id="rnd" checked> Random topic</label><button class="pri" id="gen" style="font-size:16px;padding:10px 22px">Generate</button></div>
<div id="out" style="font-size:28px;font-weight:600;margin:22px 4px 6px;min-height:40px">Hit Generate.</div>
<div id="tp" class="dim" style="margin:0 4px 14px"></div>
<div class="row"><button id="copy">Copy</button><button id="again">Another</button><button id="send">Send to writer</button><span id="st" class="dim"></span></div>
</div></div>
<div class="panel"><h2>History</h2><div id="hist" class="dim">—</div><div class="dim" id="count" style="margin-top:10px"></div></div>
</main>
<script src="classic_data.js"></script><script>
const D=window.CLASSIC_PHRASES,T=Object.keys(D),$=id=>document.getElementById(id);
$('topic').innerHTML=T.map(t=>`<option>${t}</option>`).join('');
$('count').textContent=`${T.length} topics · ${T.reduce((a,t)=>a+D[t].length,0)} phrases`;
const used=new Set(JSON.parse(sessionStorage.getItem('cpUsed')||'[]'));let cur=null,hist=[];
function pick(){const r=$('rnd').checked;let t=r?T[Math.floor(Math.random()*T.length)]:$('topic').value;
 let pool=D[t].filter(p=>!used.has(t+'|'+p));
 if(!pool.length&&r){const open=T.filter(x=>D[x].some(p=>!used.has(x+'|'+p)));if(open.length){t=open[Math.floor(Math.random()*open.length)];pool=D[t].filter(p=>!used.has(t+'|'+p));}}
 if(!pool.length){D[t].forEach(p=>used.delete(t+'|'+p));pool=D[t].slice();$('st').textContent='Topic exhausted, reshuffled';}else $('st').textContent='';
 const p=pool[Math.floor(Math.random()*pool.length)];used.add(t+'|'+p);sessionStorage.setItem('cpUsed',JSON.stringify([...used]));
 cur={t,p};$('out').textContent=p;$('tp').textContent='Topic: '+t;if(!r)$('topic').value=t;
 hist.unshift(cur);hist=hist.slice(0,12);$('hist').innerHTML=hist.map(h=>`<div style="margin:4px 0"><span style="color:var(--text)">${h.p}</span> <span class="dim">· ${h.t}</span></div>`).join('');}
$('gen').onclick=pick;$('again').onclick=pick;$('topic').onchange=()=>{$('rnd').checked=false};
$('copy').onclick=()=>{if(cur)navigator.clipboard.writeText(cur.p).then(()=>$('st').textContent='Copied')};
$('send').onclick=()=>{if(!cur)return;localStorage.setItem('flowgenSeedLine',cur.p);location.href='index.html#writer';};
</script></body></html>
